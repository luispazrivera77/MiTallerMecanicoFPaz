<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mi Taller Mecánico - F. Paz</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <h1>Mi Taller Mecánico - F. Paz</h1>
    <div class="controls">
      <input id="searchInput" type="text" placeholder="Buscar..." />
    </div>
  </header>

  <main class="wrap">
    <table id="dataTable">
      <thead>
        <tr id="tableHeader">
          <th>#</th>
          <!-- Encabezados preconfigurados -->
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>

    <div class="actions">
      <button id="addRowBtn">Agregar fila</button>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
