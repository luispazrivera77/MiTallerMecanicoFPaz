<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mi Taller Mecánico - F. Paz</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <h1>Mi Taller Mecánico - F. Paz</h1>
    <div class="controls">
      <button id="addFieldBtn">Agregar campo</button>
      <input id="searchInput" type="text" placeholder="Buscar en todas las filas…" />
    </div>
  </header>

  <main class="wrap">
    <p class="hint">
      Doble clic en un encabezado para renombrar el campo. Click en ✕ para eliminarlo.
    </p>

    <table id="dataTable">
      <thead>
        <tr id="tableHeader">
          <th class="narrow">#</th>
          <!-- Campos dinámicos aquí -->
          <th>Adjuntos</th>
          <th class="narrow">Acciones</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>

    <div class="actions">
      <button id="addRowBtn">Agregar fila</button>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
