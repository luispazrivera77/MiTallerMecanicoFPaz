<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mi Taller Mecánico - F. Paz</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <h1>Mi Taller Mecánico - F. Paz</h1>
    <div class="controls">
      <input id="searchInput" type="text" placeholder="Buscar registros..." />
      <button id="addRecordBtn" class="btn">Nuevo registro</button>
    </div>
  </header>

  <main class="wrap">
    <!-- Formulario (vertical) -->
    <section id="formContainer" class="card hidden">
      <h2 id="formTitle">Nuevo registro</h2>
      <form id="recordForm" novalidate>
        <input type="hidden" id="recordId" />
        <div id="formFields"></div>

        <div class="form-section">
          <h3>Adjuntos</h3>
          <label>Foto (opcional)</label>
          <input id="photoInput" type="file" accept="image/*" capture="environment" />
          <div id="photoPreview" class="preview"></div>

          <label>Documento PDF (opcional)</label>
          <input id="pdfInput" type="file" accept="application/pdf" />
          <div id="pdfPreview" class="preview"></div>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn primary">Guardar</button>
          <button type="button" id="cancelBtn" class="btn ghost">Cancelar</button>
        </div>
      </form>
    </section>

    <!-- Listado -->
    <section id="recordsList" class="card">
      <div class="list-head">
        <h2>Registros</h2>
        <span id="countBadge" class="badge">0</span>
      </div>
      <div id="records" class="records"></div>
      <div id="emptyState" class="empty hidden">Sin registros aún.</div>
    </section>
  </main>

  <template id="recordCardTpl">
    <article class="record-card">
      <div class="record-head">
        <h3 class="title"></h3>
        <div class="actions">
          <a class="btn thumb photo hidden" target="_blank" rel="noopener">Foto</a>
          <a class="btn thumb pdf hidden" target="_blank" rel="noopener">PDF</a>
          <button class="btn ghost edit">Editar</button>
          <button class="btn danger delete">Eliminar</button>
        </div>
      </div>
      <div class="grid-2 details"></div>
    </article>
  </template>

  <script src="app.js"></script>
</body>
</html>
